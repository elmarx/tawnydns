[package]
name = "tawnydns"
version = "0.1.0"
edition = "2024"
description = "the tenant-addon for PowerDNS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elmarx/tawnydns"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9" }
clap = { version = "4.6.7", features = ["derive", "env"] }
eros = { version = "0.8.1", features = ["better_backtrace", "user_context"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "rand_core"] }
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
thiserror = "2.0.21"
http = "1.5.0"
subtle = "2.6.1"
percent-encoding = "2.3.2"
mime = "0.3.17"
bytes = "1.12.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
ipnet = "2.12.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
